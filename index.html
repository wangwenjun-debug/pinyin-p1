<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼音小勇士（一年级）</title>
<style>
:root{--bg:#fff6dc;--card:#fff;--ink:#2b2f3a;--mute:#7a7f8c;--bl:#3b82f6;--ok:#2f9e6b;--red:#e4493b;--gold:#f0a830;--line:#f0dfae}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2230;--card:#2a2e40;--ink:#f3efe0;--mute:#a3a8b8;--line:#434860}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
main{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:6px 0 4px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 14px}
.hidden{display:none!important}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;text-align:center}
input[type=text],textarea{width:100%;font-size:20px;padding:12px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mode{padding:16px 8px;border:3px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.mode b{display:block;font-size:19px;margin:4px 0}.mode span{font-size:34px}.mode small{color:var(--mute);font-size:13px}
.mode:hover{border-color:var(--bl)}
.bar{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:8px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 14px}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.q{color:var(--mute);margin:0 0 6px}
.emo{font-size:84px;line-height:1.1}.hz{font-size:30px;font-weight:700}
.big{font-size:72px;font-weight:800;letter-spacing:2px}.tag{display:inline-block;background:var(--gold);color:#2b2f3a;border-radius:999px;padding:4px 14px;font-weight:700}
.parts{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.parts b{font-size:34px;background:var(--bg);border-radius:12px;padding:6px 14px}.parts span{font-size:26px;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.opts button{padding:16px 6px;font-size:30px;font-weight:700;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;cursor:pointer;font-family:inherit}
.opts button small{display:block;font-size:16px}
.say,.go,.sm{border:0;border-radius:14px;font-weight:700;cursor:pointer;font-family:inherit}
.say{padding:10px 22px;font-size:18px;background:var(--gold);color:#2b2f3a}
.go{display:block;margin:12px auto 0;padding:14px 34px;font-size:19px;background:var(--red);color:#fff}
.sm{padding:8px 14px;font-size:14px;background:var(--bl);color:#fff;margin:4px 4px 0 0}.sm.g{background:var(--mute)}.sm.r{background:var(--red)}
.msg{min-height:30px;font-weight:700;font-size:18px;margin:12px 0 0}
.link{display:block;margin:18px auto 0;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.crow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.crow span{width:72px;text-align:right}
.cbar{flex:1;height:14px;background:var(--line);border-radius:8px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--bl)}
.t{text-align:left}.t h3{margin:14px 0 4px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>🦸 拼音小勇士</h1>
<p class="sub">一年级汉语拼音练习</p>

<section id="home">
  <div class="card">
    <label for="name" style="font-weight:700">我的名字（或班号）</label>
    <input type="text" id="name" maxlength="12" placeholder="例如：小明 / 5号" autocomplete="off">
    <div class="modes" id="modes"></div>
  </div>
  <button class="link" id="tbtn">老师入口</button>
</section>

<section id="game" class="hidden">
  <div class="bar"><span class="pill">⭐ <span id="stars">0</span></span><span class="pill">得分 <span id="score">0</span></span><span class="pill"><span id="num">1</span>/8</span></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="card">
    <p class="q" id="q"></p><div id="stage"></div>
    <div class="opts" id="opts"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <button class="go hidden" id="next">下一题 ▶</button>
  </div>
</section>

<section id="end" class="hidden">
  <div class="card">
    <div class="big" id="estars" style="font-size:36px"></div>
    <h2 id="etitle"></h2><p id="etip"></p>
    <details style="margin-top:10px"><summary>给老师的成绩码</summary>
      <textarea id="code" rows="3" readonly></textarea>
      <button class="sm" id="copy">复制</button>
    </details>
    <button class="go" id="again">再玩一次</button>
    <button class="link" id="home2">回到首页</button>
  </div>
</section>

<section id="teacher" class="hidden">
  <div class="card t">
    <h2 style="margin:0">老师看板</h2>
    <h3>学生成绩</h3><table id="tstu"></table>
    <h3>全班难点（正确率，越低越需要加强）</h3><div id="tcat"></div>
    <h3>导入学生成绩码（每行一个）</h3>
    <textarea id="imp" rows="3"></textarea>
    <button class="sm" id="impb">导入</button><span id="impmsg"></span>
    <div style="margin-top:12px">
      <button class="sm" id="csvb">导出 CSV</button>
      <button class="sm r" id="clr">清空记录</button>
      <button class="sm g" id="back">返回</button>
    </div>
  </div>
</section>
</main>
<script>
/* ===== 老师可修改的设置 ===== */
const PIN="1234";          // 老师入口密码
const SHEET_URL="https://script.google.com/macros/s/AKfycbxElDTPIpHC3zcop6TpzcVWtfB6q3lDST4CL9zE_M5aBiJ06qoAKr7IENycJ9xfJgl-/exec";        // 可选：Google Apps Script 网址，填了会自动把每次成绩发送到表格
const N=8;                 // 每轮题数

/* ===== 题库：[图, 词, 拼音(数字=声调, 5=轻声)] ===== */
const ITEMS=[["🍎","苹果","ping2 guo3"],["🐱","猫","mao1"],["🐶","狗","gou3"],["🐟","鱼","yu2"],["🌙","月亮","yue4 liang5"],["☀️","太阳","tai4 yang2"],["💧","水","shui3"],["🔥","火","huo3"],["🌳","树","shu4"],["🍚","米饭","mi3 fan4"],["🥛","牛奶","niu2 nai3"],["🐘","大象","da4 xiang4"],["🐯","老虎","lao3 hu3"],["🐰","兔子","tu4 zi5"],["🐼","熊猫","xiong2 mao1"],["🚗","汽车","qi4 che1"],["✈️","飞机","fei1 ji1"],["🏫","学校","xue2 xiao4"],["📖","书","shu1"],["✏️","铅笔","qian1 bi3"],["🌸","花","hua1"],["🐦","鸟","niao3"],["🍉","西瓜","xi1 gua1"],["🍌","香蕉","xiang1 jiao1"],["👂","耳朵","er3 duo5"],["👀","眼睛","yan3 jing5"],["🦷","牙齿","ya2 chi3"],["🌧️","雨","yu3"],["🏠","家","jia1"],["🐔","鸡","ji1"],["🐷","猪","zhu1"],["🍞","面包","mian4 bao1"],["🥚","鸡蛋","ji1 dan4"],["🐢","乌龟","wu1 gui1"],["☁️","云","yun2"],["🌈","彩虹","cai3 hong2"],["🌛","月","yue4"]];
const INI=["zh","ch","sh","b","p","m","f","d","t","n","l","g","k","h","j","q","x","r","z","c","s","y","w"];
const MK={a:"āáǎà",o:"ōóǒò",e:"ēéěè",i:"īíǐì",u:"ūúǔù"};
/* 新加坡一年级常见难点（易混淆对） */
const INIMAP={"送气":{b:"p",p:"b",d:"t",t:"d",g:"k",k:"g",j:"q",q:"j",z:"c",c:"z",zh:"ch",ch:"zh"},"平翘舌":{z:"zh",zh:"z",c:"ch",ch:"c",s:"sh",sh:"s"},"n/l":{n:"l",l:"n",r:"l"},"f/h":{f:"h",h:"f"}};
const FINMAP={"前后鼻音":{an:"ang",ang:"an",en:"eng",eng:"en",in:"ing",ing:"in",ian:"iang",iang:"ian",uan:"uang",uang:"uan"}};
const CATS=["送气","平翘舌","n/l","f/h","前后鼻音","声调"],ALLC=[...CATS,"标调","拼读"];
const TIP={"送气":"b d g j z zh 不吹气；p t k q c ch 要吹气哦","平翘舌":"z c s 是平舌，zh ch sh 是翘舌","n/l":"n 和 l 要听清楚","f/h":"f 上齿碰下唇，h 是喉咙出气","前后鼻音":"an en in 是前鼻音，ang eng ing 是后鼻音","声调":"一声平，二声扬，三声拐弯，四声降","标调":"有 a 标 a，没 a 找 o e，i u 在一起标后面","拼读":"声母 + 韵母 + 声调，慢慢拼"};
const TN=["一","二","三","四"];
const MODES={see:["👀","看图选拼音","看图，选对拼音"],hear:["👂","听音选拼音","听一听，选对拼音"],mark:["🎩","给谁戴帽子","声调标在哪个字母"],spell:["🧩","拼一拼","拼出来是哪个字"]};

const $=id=>document.getElementById(id);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function parse(s){const m=/^([a-z]+)(\d)$/.exec(s),b=m[1],i=INI.find(x=>b.startsWith(x))||"";return{i,f:b.slice(i.length),t:+m[2]}}
function markIdx(b){let k=b.search(/[ae]/);if(k<0&&b.includes("ou"))k=b.indexOf("o");if(k<0)for(let i=b.length-1;i>=0;i--)if("aoeiu".includes(b[i])){k=i;break}return k}
const mark=(b,t)=>{if(t>4)return b;const k=markIdx(b);return b.slice(0,k)+MK[b[k]][t-1]+b.slice(k+1)};
const showPy=py=>py.split(" ").map(s=>{const p=parse(s);return mark(p.i+p.f,p.t)}).join(" ");
function mutate(py,cat){
  const syl=py.split(" ").map(parse);
  for(const k of shuf(syl.map((_,i)=>i))){
    const p=syl[k];let q=null;
    if(cat==="声调"){if(p.t<5)q={...p,t:pick([1,2,3,4].filter(x=>x!==p.t))}}
    else if(INIMAP[cat]){const m=INIMAP[cat][p.i];if(m)q={...p,i:m}}
    else if(FINMAP[cat]){const m=FINMAP[cat][p.f];if(m)q={...p,f:m}}
    if(q)return syl.map((s,j)=>{const x=j===k?q:s;return x.i+x.f+x.t}).join(" ");
  }
  return null;
}
function genOpts(py){
  let best=null;
  for(let n=0;n<40;n++){
    const cat=pick(CATS.filter(c=>mutate(py,c))),c3=pick(CATS.filter(c=>c!==cat&&mutate(py,c)));
    const cand=[[py,null,1],[mutate(py,cat),cat],[mutate(py,"声调"),"声调"],[c3&&mutate(py,c3),c3]].filter(x=>x[0]);
    const seen=new Set(),opts=[];
    cand.forEach(([q,c,ok])=>{const l=showPy(q);if(!seen.has(l)){seen.add(l);opts.push(ok?{l,ok:1}:{l,cat:c})}});
    if(opts.length===4)return{cat,opts:shuf(opts)};
    if(opts.length>=3&&(!best||opts.length>best.opts.length))best={cat,opts:shuf(opts)};
  }
  return best;
}
const ONE=ITEMS.filter(x=>!x[2].includes(" "));
const SYL=[];ITEMS.forEach(it=>it[2].split(" ").forEach(s=>{const p=parse(s),b=p.i+p.f;if(p.t<5&&(b.match(/[aeiou]/g)||[]).length>=2&&!SYL.some(x=>x.b===b&&x.t===p.t))SYL.push({b,t:p.t})}));
function markOpts(b){
  const u=[...new Set(b.split(""))],v=u.filter(c=>"aeiou".includes(c)),o=shuf(u.filter(c=>!"aeiou".includes(c)));
  const keep=new Set([...v,...o].slice(0,Math.max(4,v.length)));
  return u.filter(c=>keep.has(c));
}
function makeQ(mode){
  if(mode==="mark"){
    const L4=SYL.filter(x=>x.b.length>=4),s=pick(Math.random()<.7&&L4.length?L4:SYL),k=markIdx(s.b);
    return{cat:"标调",q:"声调符号要标在哪个字母上？",stage:`<div class="big">${s.b}</div><span class="tag">第${TN[s.t-1]}声</span>`,
      opts:markOpts(s.b).map(c=>({l:c,ok:s.b.indexOf(c)===k,cat:"标调"})),fb:mark(s.b,s.t)};
  }
  if(mode==="spell"){
    const it=pick(ONE),p=parse(it[2]),base=p.i+p.f;
    const w=shuf(ONE.filter(x=>{const o=parse(x[2]);return o.i+o.f!==base})).slice(0,3);
    return{cat:"拼读",q:"拼出来是哪个字？",stage:`<div class="parts"><b>${p.i||"–"}</b><span>+</span><b>${p.f}</b><span>+</span><b>${TN[p.t-1]}声</b></div>`,
      opts:shuf([{l:it[0]+"<small>"+it[1]+"</small>",ok:1},...w.map(x=>({l:x[0]+"<small>"+x[1]+"</small>",cat:"拼读"}))]),fb:showPy(it[2])};
  }
  let it,g;do{it=pick(ITEMS);g=genOpts(it[2])}while(!g);
  const hear=mode==="hear";
  return{cat:g.cat,q:hear?"听一听，选出正确的拼音":"选出正确的拼音",speak:hear?it[1]:null,
    stage:hear?`<div class="emo">🔊</div><button class="say" id="say">再听一遍</button>`:`<div class="emo">${it[0]}</div><div class="hz">${it[1]}</div>`,
    opts:g.opts,fb:""};
}
/* ===== 界面与记录 ===== */
let mode="see",qi=0,score=0,stars=0,cur=null,tries=0,done=false,log=[];
const show=id=>["home","game","end","teacher"].forEach(v=>$(v).classList.toggle("hidden",v!==id));
function say(t,c){const m=$("msg");m.textContent=t;m.style.color=c==="ok"?"var(--ok)":c==="bad"?"var(--red)":"inherit"}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function recs(){try{return JSON.parse(localStorage.getItem("pyRec")||"[]")}catch(e){return[]}}
function saveRecs(a){try{localStorage.setItem("pyRec",JSON.stringify(a))}catch(e){}}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
const pct=(c,a)=>a?Math.round(c/a*100):0;

Object.entries(MODES).forEach(([k,v])=>{const b=document.createElement("button");b.className="mode";b.innerHTML=`<span>${v[0]}</span><b>${v[1]}</b><small>${v[2]}</small>`;b.onclick=()=>begin(k);$("modes").appendChild(b)});
try{$("name").value=localStorage.getItem("pyName")||""}catch(e){}

function begin(m){
  const nm=$("name").value.trim();
  if(!nm){$("name").focus();$("name").placeholder="请先写上名字哦！";return}
  try{localStorage.setItem("pyName",nm)}catch(e){}
  mode=m;qi=0;score=0;stars=0;log=[];$("stars").textContent=0;$("score").textContent=0;show("game");ask();
}
function ask(){
  cur=makeQ(mode);tries=0;done=false;
  $("num").textContent=qi+1;$("prog").style.width=(qi/N*100)+"%";
  $("q").textContent=cur.q;$("stage").innerHTML=cur.stage;$("next").classList.add("hidden");say("");
  if(cur.speak){$("say").onclick=()=>speak(cur.speak);speak(cur.speak);if(!("speechSynthesis" in window))say("这个浏览器不会朗读，请换别的玩法","bad")}
  $("opts").innerHTML="";
  cur.opts.forEach(o=>{const b=document.createElement("button");b.innerHTML=o.l;b.onclick=()=>choose(b,o);$("opts").appendChild(b)});
}
function choose(b,o){
  if(done)return;
  if(o.ok){
    done=true;
    if(tries===0){log.push({c:cur.cat,ok:1});stars++;$("stars").textContent=stars}
    score+=tries?5:10;$("score").textContent=score;
    say("🎉 对啦！"+(cur.fb?" "+cur.fb:""),"ok");$("next").classList.remove("hidden");
  }else{
    if(tries===0)log.push({c:cur.cat,ok:0});
    tries++;say("再想想～ "+(TIP[o.cat]||""),"bad");
  }
}
$("next").onclick=()=>{qi++;qi>=N?finish():ask()};
function finish(){
  const cats={};log.forEach(r=>{const c=cats[r.c]||(cats[r.c]=[0,0]);c[0]++;c[1]+=r.ok});
  const ok=log.filter(r=>r.ok).length;
  const rec={t:new Date().toISOString(),name:$("name").value.trim(),mode,score,n:N,ok,cats};
  const a=recs();a.push(rec);saveRecs(a);
  if(SHEET_URL){try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(rec)})}catch(e){}}
  $("estars").textContent="⭐".repeat(ok)||"💪";
  $("etitle").textContent=`${rec.name}，得分 ${score}，首次答对 ${ok}/${N}`;
  const w=Object.entries(cats).find(([k,v])=>v[1]<v[0]);
  $("etip").textContent=w?`小提醒：「${w[0]}」还要多练练。${TIP[w[0]]||""}`:"全部一次答对，太棒了！";
  $("code").value=enc(rec);show("end");
}
$("again").onclick=()=>begin(mode);$("home2").onclick=()=>show("home");
$("copy").onclick=()=>{$("code").select();try{document.execCommand("copy")}catch(e){}};

/* ===== 老师看板 ===== */
$("tbtn").onclick=()=>{if(prompt("请输入老师密码")===PIN){show("teacher");dash()}};
$("back").onclick=()=>show("home");
function dash(){
  const R=recs(),S={},C={};
  R.forEach(r=>{const s=S[r.name]||(S[r.name]={n:0,sc:0,a:0,c:0,cat:{}});s.n++;s.sc+=r.score;
    for(const k in r.cats){const[a,c]=r.cats[k];s.a+=a;s.c+=c;const x=s.cat[k]||(s.cat[k]=[0,0]);x[0]+=a;x[1]+=c;const y=C[k]||(C[k]=[0,0]);y[0]+=a;y[1]+=c}});
  const names=Object.keys(S).sort();
  $("tstu").innerHTML=names.length?"<tr><th>姓名</th><th>次数</th><th>总分</th><th>准确率</th><th>需加强</th></tr>"+names.map(n=>{const s=S[n];
    const w=Object.entries(s.cat).filter(([k,v])=>v[0]>=2&&v[1]<v[0]).sort((a,b)=>a[1][1]/a[1][0]-b[1][1]/b[1][0])[0];
    return `<tr><td>${esc(n)}</td><td>${s.n}</td><td>${s.sc}</td><td>${pct(s.c,s.a)}%</td><td>${w?w[0]+" "+pct(w[1][1],w[1][0])+"%":"—"}</td></tr>`}).join(""):"<tr><td>还没有记录</td></tr>";
  $("tcat").innerHTML=Object.keys(C).sort((a,b)=>pct(C[a][1],C[a][0])-pct(C[b][1],C[b][0])).map(k=>`<div class="crow"><span>${k}</span><div class="cbar"><i style="width:${pct(C[k][1],C[k][0])}%"></i></div><b>${pct(C[k][1],C[k][0])}%</b><small>${C[k][1]}/${C[k][0]}</small></div>`).join("")||"还没有记录";
}
$("impb").onclick=()=>{
  const a=recs();let ok=0,bad=0;
  $("imp").value.split("\n").filter(l=>l.trim()).forEach(l=>{try{const r=dec(l);if(!a.some(x=>x.t===r.t&&x.name===r.name&&x.mode===r.mode)){a.push(r);ok++}}catch(e){bad++}});
  saveRecs(a);$("impmsg").textContent=` 导入 ${ok} 条${bad?`，${bad} 条无法识别`:""}`;$("imp").value="";dash();
};
$("csvb").onclick=()=>{
  const rows=[["时间","姓名","玩法","得分","题数","首次答对","准确率",...ALLC]];
  recs().forEach(r=>rows.push([r.t.slice(0,16).replace("T"," "),r.name,(MODES[r.mode]||[])[1]||r.mode,r.score,r.n,r.ok,pct(r.ok,r.n)+"%",...ALLC.map(k=>r.cats[k]?r.cats[k][1]+"/"+r.cats[k][0]:"")]));
  const txt="\ufeff"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));a.download="拼音成绩.csv";a.click();
};
$("clr").onclick=()=>{if(confirm("确定清空本设备上的所有记录吗？")){saveRecs([]);dash()}};
</script>
